<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A90D9"/>
      <stop offset="100%" stop-color="#2C5F8A"/>
    </linearGradient>
    <linearGradient id="pen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Large W letterform -->
  <text x="512" y="620" font-family="Georgia, serif" font-weight="bold" font-size="580"
        fill="white" text-anchor="middle" dominant-baseline="central" opacity="0.15">W</text>

  <!-- Stylized document/page -->
  <rect x="280" y="240" width="464" height="580" rx="32" ry="32" fill="white" opacity="0.95"/>

  <!-- Text lines on the document -->
  <!-- Line 1: red strikethrough (removed) -->
  <rect x="340" y="320" width="200" height="16" rx="8" fill="#E85B5B" opacity="0.8"/>
  <line x1="340" y1="328" x2="540" y2="328" stroke="#C0392B" stroke-width="2.5"/>

  <!-- Line 1: green (added) -->
  <rect x="555" y="320" width="140" height="16" rx="8" fill="#4CAF50" opacity="0.8"/>

  <!-- Line 2: unchanged -->
  <rect x="340" y="370" width="340" height="16" rx="8" fill="#555555" opacity="0.35"/>

  <!-- Line 3: red strikethrough -->
  <rect x="340" y="420" width="160" height="16" rx="8" fill="#E85B5B" opacity="0.8"/>
  <line x1="340" y1="428" x2="500" y2="428" stroke="#C0392B" stroke-width="2.5"/>

  <!-- Line 3: green -->
  <rect x="515" y="420" width="180" height="16" rx="8" fill="#4CAF50" opacity="0.8"/>

  <!-- Line 4: unchanged -->
  <rect x="340" y="470" width="280" height="16" rx="8" fill="#555555" opacity="0.35"/>

  <!-- Line 5: unchanged -->
  <rect x="340" y="520" width="320" height="16" rx="8" fill="#555555" opacity="0.35"/>

  <!-- Line 6: green only (insertion) -->
  <rect x="340" y="570" width="220" height="16" rx="8" fill="#4CAF50" opacity="0.8"/>

  <!-- Line 7: unchanged -->
  <rect x="340" y="620" width="260" height="16" rx="8" fill="#555555" opacity="0.35"/>

  <!-- Line 8: red strikethrough -->
  <rect x="340" y="670" width="120" height="16" rx="8" fill="#E85B5B" opacity="0.8"/>
  <line x1="340" y1="678" x2="460" y2="678" stroke="#C0392B" stroke-width="2.5"/>

  <!-- Line 8: green -->
  <rect x="475" y="670" width="150" height="16" rx="8" fill="#4CAF50" opacity="0.8"/>

  <!-- Line 9: unchanged short -->
  <rect x="340" y="720" width="180" height="16" rx="8" fill="#555555" opacity="0.35"/>

  <!-- Small pencil accent in bottom-right corner -->
  <g transform="translate(660, 700) rotate(-45)">
    <rect x="0" y="-12" width="100" height="24" rx="4" fill="url(#pen)" stroke="#888" stroke-width="2"/>
    <polygon points="100,-12 100,12 125,0" fill="#F5C842" stroke="#D4A017" stroke-width="1.5"/>
    <polygon points="125,-1 125,1 132,0" fill="#333"/>
  </g>
</svg>
